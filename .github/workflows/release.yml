name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the release body is read from the tag's own commit message
          fetch-depth: 0

      - name: Build the mod zip (same flow as the repo checks)
        run: tools/build_release.sh "$GITHUB_REF_NAME"

      - name: The release body = what this round shipped (the tag commit's)
        run: |
          git log -1 --format=%B "$GITHUB_REF_NAME" > "dist/notes-base.md"

      - name: Compute the APPLY guide from the real diff (previous tag .. this)
        id: apply_guide
        run: |
          PREV=$(git tag --sort=-creatordate | grep -v "^$GITHUB_REF_NAME$" | head -1 || true)
          {
            echo "__GUIDE_START__"
            sh tools/release_guide.sh "${PREV:-}" "$GITHUB_REF_NAME" || true
            echo "__GUIDE_END__"
          } > "dist/apply-guide.md"

      - name: Assemble the release notes (what shipped + how to apply it)
        run: |
          : > "dist/release-notes.md"
          cat "dist/notes-base.md" >> "dist/release-notes.md" 2>/dev/null || true
          sed -n '/__GUIDE_START__/,/__GUIDE_END__/p' "dist/apply-guide.md" |
              grep -v "__GUIDE_" >> "dist/release-notes.md" 2>/dev/null || true

      - name: Publish a GitHub release with the zip
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
          body_path: dist/release-notes.md
          generate_release_notes: true
