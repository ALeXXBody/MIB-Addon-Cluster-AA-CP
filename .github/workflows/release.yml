name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the release body is read from the tag's own commit message
          fetch-depth: 0

      - name: Release body = what this round shipped (the tag commit's message)
        id: notes
        run: |
          {
            echo "body<<GHR_BODY"
            git log -1 --format=%B "$GITHUB_REF_NAME"
            echo GHR_BODY
          } >> "$GITHUB_OUTPUT"

      - name: Build the mod zip (same flow as the repo checks)
        run: tools/build_release.sh "$GITHUB_REF_NAME"

      - name: Publish a GitHub release with the zip
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
